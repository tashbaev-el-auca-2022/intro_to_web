<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Image Gallery with Modal and Navigation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f7f7f7;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      justify-items: center;
    }
    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      transition: transform 0.3s ease;
      cursor: pointer;
    }
    .gallery img:hover {
      transform: scale(1.05);
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      overflow: auto;
      padding-top: 60px;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      max-width: 90%;
      max-height: 80%;
      margin: auto;
      display: block;
      border-radius: 10px;
    }
    .close {
      position: absolute;
      top: 20px;
      right: 20px;
      color: white;
      font-size: 30px;
      font-weight: bold;
      cursor: pointer;
      background-color: transparent;
      border: none;
    }
    .close:hover,
    .close:focus {
      color: #f1f1f1;
      text-decoration: none;
      cursor: pointer;
    }
    .nav-buttons {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      font-size: 30px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }
    .prev {
      left: 10px;
    }
    .next {
      right: 10px;
    }
  </style>
</head>
<body>

  <h2>Image Gallery with Modal and Navigation</h2>
  <div class="gallery" id="gallery"></div>

  <div id="imageModal" class="modal">
    <span class="close" id="closeBtn">&times;</span>
    <span class="nav-buttons prev" id="prevBtn">&#8592;</span>
    <img class="modal-content" id="modalImage">
    <span class="nav-buttons next" id="nextBtn">&#8594;</span>
  </div>

  <script>
    const imageUrls = [
      'https://i.pinimg.com/736x/2f/fa/f6/2ffaf6dca014f5dd7389d70f5f95a6fa.jpg',
      'https://i.pinimg.com/736x/b3/dd/92/b3dd92d6db84a0d98a86d797f27c1eea.jpg',
      'https://i.pinimg.com/736x/87/88/ad/8788adec7a631f827b9d86a9c7c897e7.jpg',
      'https://i.pinimg.com/736x/cc/ff/d2/ccffd2efaa96cd3834d13d635f257bf4.jpg',
      'https://i.pinimg.com/736x/f6/af/0f/f6af0fc6fc19121c5833cc93cd33c11b.jpg'
    ];

    const gallery = document.getElementById('gallery');
    const modal = document.getElementById("imageModal");
    const modalImage = document.getElementById("modalImage");
    const closeBtn = document.getElementById("closeBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    let currentIndex = 0;
    const imagesArray = [];

    imageUrls.forEach((url, index) => {
      const img = document.createElement('img');
      img.src = url;
      img.alt = `Image ${index + 1}`;
      img.classList.add('gallery-image');
      img.addEventListener('click', function() {
        modal.style.display = 'flex';
        modalImage.src = this.src;
        currentIndex = index; 
      });
      gallery.appendChild(img);
      imagesArray.push(img); 
    });

    closeBtn.addEventListener('click', function() {
      modal.style.display = 'none';
    });

    window.addEventListener('click', function(event) {
      if (event.target === modal) {
        modal.style.display = 'none';
      }
    });

    prevBtn.addEventListener('click', function() {
      currentIndex = (currentIndex === 0) ? imagesArray.length - 1 : currentIndex - 1;
      modalImage.src = imagesArray[currentIndex].src;
    });

    nextBtn.addEventListener('click', function() {
      currentIndex = (currentIndex === imagesArray.length - 1) ? 0 : currentIndex + 1;
      modalImage.src = imagesArray[currentIndex].src;
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Image Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f7f7f7;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      justify-items: center;
    }
    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      transition: transform 0.3s ease;
    }
    .gallery img:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="gallery">
    <img src="https://i.pinimg.com/736x/2f/fa/f6/2ffaf6dca014f5dd7389d70f5f95a6fa.jpg" alt="Image 1">
    <img src="https://i.pinimg.com/736x/b3/dd/92/b3dd92d6db84a0d98a86d797f27c1eea.jpg" alt="Image 2">
    <img src="https://i.pinimg.com/736x/87/88/ad/8788adec7a631f827b9d86a9c7c897e7.jpg" alt="Image 3">
    <img src="https://i.pinimg.com/736x/cc/ff/d2/ccffd2efaa96cd3834d13d635f257bf4.jpg" alt="Image 4">
    <img src="https://i.pinimg.com/736x/22/8f/00/228f00bdd64c703a010919ea0f6e137b.jpg" alt="Image 5">
    <img src="https://i.pinimg.com/736x/e9/f3/06/e9f306bd627509bbf4b12e6212f3bbd7.jpg" alt="Image 6">
    <img src="https://i.pinimg.com/736x/f6/af/0f/f6af0fc6fc19121c5833cc93cd33c11b.jpg" alt="Image 7">
  </div>

  <div id="modal" class="modal">
    <span class="close" id="closeModal">&times;</span>
    <img class="modal-content" id="modalImage">
    <div id="caption"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
